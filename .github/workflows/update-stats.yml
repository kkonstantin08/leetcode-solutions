name: Update LeetCode stats

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-leetcode-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Update README statistics
        run: python .github/scripts/update_stats.py

      - name: Commit updated statistics
        run: |
          if git diff --quiet -- README.md; then
            echo "README statistics are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update LeetCode stats"
          git pull --rebase origin main
          git push
